<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multimodal Agent</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <section id="auth-view" class="auth-view hidden">
    <div class="auth-card">
      <div class="brand-mark">M</div>
      <h1 id="auth-title">Welcome back</h1>
      <p id="auth-copy">Sign in to continue your conversations.</p>
      <form id="auth-form">
        <label>Email<input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></label>
        <label>Password<input id="password" type="password" minlength="8" autocomplete="current-password" required placeholder="At least 8 characters"></label>
        <button id="auth-submit" class="primary" type="submit">Sign in</button>
      </form>
      <p id="auth-error" class="auth-error" role="alert"></p>
      <button id="auth-toggle" class="text-button" type="button">New here? Create an account</button>
    </div>
  </section>

  <main id="app-view" class="app-view hidden">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-top">
        <div class="brand"><span class="brand-mark small">M</span><strong>Multimodal</strong></div>
        <button id="close-sidebar" class="icon-button mobile-only" type="button" aria-label="Close sidebar">&times;</button>
      </div>
      <button id="new-thread" class="new-thread" type="button"><span>+</span> New chat</button>
      <div class="history-label">Your conversations</div>
      <nav id="threads" class="threads" aria-label="Conversation history"></nav>
      <div class="sidebar-footer">
        <div class="user-row">
          <div id="user-avatar" class="avatar">U</div>
          <div class="user-details"><strong id="user-name">User</strong><span id="user-email"></span></div>
          <button id="logout" class="icon-button" type="button" title="Log out" aria-label="Log out">&#x21AA;</button>
        </div>
      </div>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <button id="open-sidebar" class="icon-button mobile-only" type="button" aria-label="Open sidebar">&#9776;</button>
        <div><strong id="thread-title">New conversation</strong><span class="status-dot">Checking...</span></div>
      </header>

      <div id="chat" class="chat">
        <section id="welcome" class="welcome">
          <div class="brand-mark">M</div>
          <h2>How can I help you today?</h2>
          <p>Ask a question or upload a PDF, image, or audio file.</p>
        </section>
      </div>

      <div class="composer-wrap">
        <form id="form" class="composer">
          <label class="attach" for="files" title="Attach files">+</label>
          <input id="files" class="file-input" type="file" multiple accept="image/png,image/jpeg,application/pdf,audio/*">
          <textarea id="message" rows="1" placeholder="Message Multimodal Agent"></textarea>
          <button id="send" class="send" type="submit" aria-label="Send message">&#8593;</button>
        </form>
        <div id="file-list" class="file-list"></div>
        <p class="disclaimer">AI can make mistakes. Check important information.</p>
      </div>
    </section>
  </main>
</body>
</html>
